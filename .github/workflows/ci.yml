name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Genera Prisma Client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit dipendenze di produzione
        # Non bloccante: al momento esistono vulnerabilità note nelle
        # dipendenze transitive (es. exceljs, sharp) senza fix non-breaking
        # disponibile. Da rivalutare e stringere quando saranno risolte.
        run: npm audit --omit=dev
        continue-on-error: true

  # Test di integrazione su un Postgres reale (npm run test:db): verificano
  # migration, indici parziali, FK composite e transazioni, che i test unitari
  # con Prisma mockato non vedono. Il global setup crea e distrugge il DB
  # gestionale_test su questo servizio, che è usa e getta.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password_ci
          POSTGRES_DB: gestionale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d gestionale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://admin:password_ci@localhost:5432/gestionale
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Test di integrazione DB
        run: npm run test:db
