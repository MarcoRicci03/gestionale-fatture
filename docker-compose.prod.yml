# Stack di produzione: applicazione + Postgres + backup automatico del database.
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Richiede un file .env.prod nella root del progetto (vedi .env.prod.example)
# con almeno: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL,
# JWT_SECRET, JWT_EXPIRES_IN.

services:
  db:
    image: postgres:16-alpine
    container_name: gestionale-db
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # DEP-10: limiti conservativi per una VPS piccola (~2GB RAM); da
    # ritarare in base alle specifiche reali della macchina scelta.
    mem_limit: 512m
    cpus: 1.0
    networks:
      - internal

  app:
    image: gestionale-fatture-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestionale-app
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 768m
    cpus: 1.0
    networks:
      - internal

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: gestionale-db-backup
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: db
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - ./backups:/backups
      - ./rclone.conf:/rclone.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 256m
    cpus: 0.5
    networks:
      - internal

  audit-log-retention:
    image: gestionale-fatture-app
    container_name: gestionale-audit-log-retention
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      AUDIT_LOG_RETENTION_MONTHS: ${AUDIT_LOG_RETENTION_MONTHS:-12}
      AUDIT_LOG_RETENTION_WEEKDAY: ${AUDIT_LOG_RETENTION_WEEKDAY:-0}
      AUDIT_LOG_RETENTION_HOUR: ${AUDIT_LOG_RETENTION_HOUR:-3}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["node", "scripts/audit-log-retention.mjs"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 128m
    cpus: 0.25
    networks:
      - internal

networks:
  internal:

volumes:
  db_data:
