# Stack di produzione: applicazione + Postgres + backup automatico del database.
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Richiede un file .env.prod nella root del progetto (vedi .env.prod.example)
# con almeno: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL,
# JWT_SECRET, JWT_EXPIRES_IN.

services:
  db:
    image: postgres:16-alpine
    container_name: gestionale-db
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestionale-app
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - internal

  backup:
    image: postgres:16-alpine
    container_name: gestionale-db-backup
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: db
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "-c", "apk add --no-cache gnupg && sh /backup-db.sh"]
    networks:
      - internal

networks:
  internal:

volumes:
  db_data:
