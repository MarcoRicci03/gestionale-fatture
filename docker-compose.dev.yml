services:
  db-locale:
    image: postgres:16-alpine
    container_name: postgres-dev
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password_dev
      POSTGRES_DB: gestionale
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres_dev_data:/var/lib/postgresql/data